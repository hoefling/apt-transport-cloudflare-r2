[package]
name = "apt-transport-r2"
version = "0.1.0"
edition = "2021"
description = "APT transport method for Cloudflare R2"
license = "MIT"

[[bin]]
name = "r2"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-sdk-s3 = "1"
hex = "0.4"
md-5 = "0.11"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"

[package.metadata.deb]
name = "apt-transport-r2"
maintainer = "Oleg Hoefling <oleg.hoefling@gmail.com>"
copyright = "2026, Oleg Hoefling <oleg.hoefling@gmail.com>"
extended-description = "APT transport method for Cloudflare R2 object storage."
depends = "$auto"
section = "admin"
priority = "optional"
assets = [
  ["target/release/r2", "usr/lib/apt/methods/r2", "755"],
  ["pkg/debian/assets/r2.conf", "etc/apt/apt.conf.d/r2.conf", "644"],
]
conf-files = [
  "/etc/apt/apt.conf.d/r2.conf",
]
